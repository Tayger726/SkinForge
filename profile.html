<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — AEROX</title><meta name="theme-color" content="#08b8ff"><link rel="stylesheet" href="styles.css?v=195"><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
.profile-wrap{max-width:1180px;margin:0 auto;padding:34px 20px 50px}.profile-hero{position:relative;overflow:hidden;border:1px solid #173a52;border-radius:24px;background:radial-gradient(circle at 82% 0,rgba(0,184,255,.18),transparent 30%),linear-gradient(145deg,#0b1622,#081019);padding:28px;box-shadow:0 24px 70px #0007}.profile-hero:after{content:'X';position:absolute;right:42px;top:-52px;font-size:240px;font-weight:1000;line-height:1;color:rgba(18,177,244,.055);pointer-events:none}.profile-main{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}.profile-user{display:flex;align-items:center;gap:18px;min-width:0}.profile-avatar{width:88px;height:88px;border-radius:22px;border:1px solid #2b7399;background:#0b2435;object-fit:cover;box-shadow:0 0 35px rgba(0,184,255,.15)}.profile-avatar-fallback{display:grid;place-items:center;font-size:32px;font-weight:950;color:#4acaff}.profile-name{font-size:clamp(28px,5vw,42px);font-weight:950;margin:0 0 6px;line-height:1}.profile-id{color:#7794a8;font-size:13px;word-break:break-all}.profile-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pbadge{border:1px solid #22506c;background:#0d2130;border-radius:999px;padding:6px 10px;color:#9edcf7;font-size:11px;font-weight:850}.pbadge.ok{color:#74e7ac;border-color:#24583f;background:#0d241a}.profile-actions{display:flex;gap:10px;flex-wrap:wrap}.pbtn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:11px 15px;font-weight:850;border:1px solid #23465d;background:#0d1a25;color:#dbeef8}.pbtn.primary{border-color:#13aff0;background:linear-gradient(135deg,#07aeea,#167fea);color:white}.profile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}.profile-stat{border:1px solid #173448;border-radius:16px;background:#0a141e;padding:17px}.profile-stat span{color:#738c9f;font-size:12px}.profile-stat strong{display:block;font-size:27px;margin-top:7px}.profile-body{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-top:18px}.psection{border:1px solid #173448;border-radius:20px;background:linear-gradient(150deg,#0b151f,#081119);padding:20px}.psection h2{margin:0 0 14px;font-size:20px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card{border:1px solid #1c3a4f;border-radius:14px;background:#0a1721;padding:15px;transition:.18s}.quick-card:hover{transform:translateY(-2px);border-color:#1599cf}.quick-card b{display:block;margin-bottom:5px}.quick-card span{font-size:12px;color:#7892a5}.account-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #152b3b}.account-row:last-child{border-bottom:0}.account-row span{color:#7892a5}.account-row strong{text-align:right}.login-card{max-width:580px;margin:80px auto;border:1px solid #174b67;border-radius:24px;padding:34px;text-align:center;background:radial-gradient(circle at 50% 0,rgba(0,184,255,.15),transparent 38%),#0a141e}.login-mark{font-size:74px;font-weight:1000;color:#21bff5;line-height:1;margin-bottom:15px}.login-card h1{margin:0 0 10px}.login-card p{color:#839bad;line-height:1.6}.cloud-note{margin-top:14px;border:1px solid #19415a;background:#0b1b27;border-radius:13px;padding:12px;color:#8bb2c8;font-size:12px}.profile-loading{padding:70px;text-align:center;color:#7d96a9}@media(max-width:900px){.profile-grid{grid-template-columns:repeat(2,1fr)}.profile-body{grid-template-columns:1fr}}@media(max-width:600px){.profile-wrap{padding:20px 12px 40px}.profile-hero{padding:20px}.profile-user{align-items:flex-start}.profile-avatar{width:70px;height:70px;border-radius:17px}.profile-grid,.quick-grid{grid-template-columns:1fr}.profile-actions{width:100%}.profile-actions a{flex:1}.profile-hero:after{font-size:170px;right:-10px;top:0}}
</style></head><body>
<header class="topbar"><div class="shell"><a class="logo" href="index.html">AERO<span>X</span></a><nav><a href="catalog.html">Рынки</a><a href="radar.html">Сканер</a><a href="analytics.html">Аналитика</a><a href="portfolio.html">Портфель</a><a href="favorites.html">Избранное</a><a href="alerts.html">Уведомления</a><a href="pro.html">PRO</a></nav><div class="actions"><a class="ghost" href="index.html">Главная</a></div></div></header>
<main class="profile-wrap"><div id="profileRoot" class="profile-loading">Загрузка профиля...</div></main>
<footer class="footer">AEROX • Steam account + cloud sync</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.getElementById('profileRoot');
(async()=>{try{const me=await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json());if(!me.authenticated){root.className='';root.innerHTML=`<section class="login-card"><div class="login-mark">X</div><div class="eyebrow">AEROX ACCOUNT</div><h1>Войди в свой профиль</h1><p>Авторизация проходит через Steam. После входа избранное, портфель и ценовые уведомления будут доступны в твоём AEROX-аккаунте на других устройствах.</p><a class="pbtn primary" href="/auth/steam">Войти через Steam</a></section>`;return}const [ud,plans]=await Promise.all([fetch('/api/user-data',{credentials:'same-origin'}).then(r=>r.json()),fetch('/api/plans').then(r=>r.json()).catch(()=>({}))]);const p=me.profile||{},fav=Array.isArray(ud.favorites)?ud.favorites:[],port=Array.isArray(ud.portfolio)?ud.portfolio:[],alerts=Array.isArray(ud.alerts)?ud.alerts:[];const avatar=p.avatarfull?`<img class="profile-avatar" src="${esc(p.avatarfull)}" alt="Аватар Steam">`:`<div class="profile-avatar profile-avatar-fallback">X</div>`;const updated=ud.updated_at?new Date(ud.updated_at).toLocaleString('ru-RU'):'Ещё не синхронизировался';const plan='Free';root.className='';root.innerHTML=`<section class="profile-hero"><div class="profile-main"><div class="profile-user">${avatar}<div><div class="eyebrow">AEROX PROFILE</div><h1 class="profile-name">${esc(p.personaname||'Steam user')}</h1><div class="profile-id">SteamID: ${esc(p.steamid||'—')}</div><div class="profile-badges"><span class="pbadge ok">● Steam подключён</span><span class="pbadge">${plan}</span>${me.is_admin?'<span class="pbadge">OWNER</span>':''}</div></div></div><div class="profile-actions">${p.profileurl?`<a class="pbtn" href="${esc(p.profileurl)}" target="_blank" rel="noopener">Открыть Steam</a>`:''}${me.is_admin?'<a class="pbtn" href="admin.html">Админка</a>':''}<a class="pbtn primary" href="/auth/logout">Выйти</a></div></div><div class="profile-grid"><a class="profile-stat" href="favorites.html"><span>Избранное</span><strong>${fav.length}</strong></a><a class="profile-stat" href="portfolio.html"><span>Портфель</span><strong>${port.length}</strong></a><a class="profile-stat" href="alerts.html"><span>Уведомления</span><strong>${alerts.length}</strong></a><a class="profile-stat" href="pro.html"><span>Тариф</span><strong>${plan}</strong></a></div></section><div class="profile-body"><section class="psection"><h2>Быстрый доступ</h2><div class="quick-grid"><a class="quick-card" href="catalog.html"><b>Рынок скинов</b><span>Ищи предметы и сравнивай текущие цены.</span></a><a class="quick-card" href="radar.html"><b>Deal Radar</b><span>Смотри наиболее интересные предложения рынка.</span></a><a class="quick-card" href="portfolio.html"><b>Мой портфель</b><span>Следи за стоимостью своих скинов и результатом.</span></a><a class="quick-card" href="alerts.html"><b>Ценовые уведомления</b><span>Управляй целевыми ценами на выбранные предметы.</span></a><a class="quick-card" href="analytics.html"><b>Аналитика</b><span>Смотри данные и движение рынка CS2.</span></a><a class="quick-card" href="support.html"><b>Поддержка</b><span>Создай обращение и проверь ответы.</span></a></div></section><aside class="psection"><h2>Аккаунт</h2><div class="account-row"><span>Статус</span><strong>Активен</strong></div><div class="account-row"><span>Вход</span><strong>Steam</strong></div><div class="account-row"><span>Тариф</span><strong>${plan}</strong></div><div class="account-row"><span>Облако</span><strong>Подключено</strong></div><div class="account-row"><span>Последняя синхронизация</span><strong>${esc(updated)}</strong></div><div class="cloud-note">Избранное, портфель и уведомления сохраняются в PostgreSQL и привязываются к твоему SteamID.</div></aside></div>`}catch(e){root.className='';root.innerHTML=`<section class="login-card"><div class="login-mark">!</div><h1>Не удалось загрузить профиль</h1><p>${esc(e.message||'Попробуй обновить страницу.')}</p><a class="pbtn primary" href="profile.html">Обновить</a></section>`}})();
</script></body></html>
