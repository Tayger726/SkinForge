<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — SkinForge</title><link rel="stylesheet" href="styles.css?v=160"></head><body><header class="topbar"><div class="shell"><a class="logo" href="index.html">Skin<span>Forge</span></a><nav><a href="catalog.html">Каталог</a><a href="portfolio.html">Портфель</a><a href="favorites.html">Избранное</a><a href="alerts.html">Уведомления</a></nav><div class="actions"><a class="primary" href="/auth/logout">Выйти</a></div></div></header><main class="shell"><section class="section"><div class="panel" id="profileRoot"><h2>Профиль Steam</h2><p class="muted">Загрузка...</p></div></section></main><footer class="footer">SkinForge Market v16 • Steam account + PostgreSQL</footer><script>(async()=>{const r=document.getElementById('profileRoot');try{const me=await fetch('/api/me').then(x=>x.json());if(!me.authenticated){r.innerHTML='<h2>Профиль</h2><a class="primary" href="/auth/steam">Войти через Steam</a>';return}const d=await fetch('/api/user-data').then(x=>x.json()),p=me.profile||{};r.innerHTML=`<h2>${p.personaname||'Steam'}</h2><div class="muted">${p.steamid||''}</div><div class="portfolio-summary" style="margin-top:20px"><div class="stat-box"><span>Избранное</span><strong>${(d.favorites||[]).length}</strong></div><div class="stat-box"><span>Портфель</span><strong>${(d.portfolio||[]).length}</strong></div><div class="stat-box"><span>Уведомления</span><strong>${(d.alerts||[]).length}</strong></div></div><div class="notice" style="margin-top:18px">Данные сохраняются в облачном аккаунте SkinForge и доступны после входа на другом устройстве.</div>`}catch(e){r.innerHTML='<h2>Профиль</h2><p class="muted">Ошибка загрузки.</p>'}})()</script></body></html>
