<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог — SkinForge</title><link rel="stylesheet" href="styles.css?v=164"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#8061ff"><style>
body{background:radial-gradient(circle at 15% -10%,rgba(128,97,255,.14),transparent 30%),#070a10}.topbar .shell{max-width:1500px}.catalog-shell{max-width:1500px;margin:auto;padding:0 18px}.market-tabs{display:flex;gap:8px;overflow:auto;padding:14px 0 12px;border-bottom:1px solid #20283a;scrollbar-width:none}.market-tabs::-webkit-scrollbar{display:none}.market-tab{white-space:nowrap;border:1px solid #293246;background:#0e141f;color:#c3ccda;border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}.market-tab.active,.market-tab:hover{border-color:#8061ff;background:#171329;color:#fff}.catalog-toolbar{display:grid;grid-template-columns:1fr 210px;gap:12px;margin:14px 0}.searchbox{display:flex;align-items:center;gap:10px;background:#0d131d;border:1px solid #2a3446;border-radius:12px;padding:0 14px}.searchbox input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:13px 0}.catalog-toolbar select{background:#0d131d;border:1px solid #2a3446;color:#fff;border-radius:12px;padding:0 12px}.market-layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.market-sidebar{position:sticky;top:84px;height:max-content;background:#0d131d;border:1px solid #222c3d;border-radius:14px;padding:15px}.side-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.side-title h3{margin:0}.reset-btn{border:0;background:transparent;color:#9c8cff;cursor:pointer}.filter-group{margin:0 0 16px}.filter-group label{display:block;color:#aab4c5;font-size:12px;margin-bottom:7px}.filter-group input,.filter-group select{width:100%;background:#090e16;border:1px solid #2a3446;color:white;border-radius:9px;padding:10px}.price-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-row{display:flex;align-items:center;gap:9px;color:#c0c8d6;font-size:13px;margin:10px 0}.check-row input{width:auto}.sidebar-divider{height:1px;background:#20293a;margin:14px 0}.catalog-main{min-width:0}.catalog-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}.catalog-head h2{margin:0;font-size:22px}.catalog-meta{color:#8995a8;font-size:12px}.results{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.results .card{border-radius:14px;padding:11px;background:linear-gradient(160deg,#111824,#0d131d);min-width:0}.results .skin-art{height:150px;border-radius:11px;background:radial-gradient(circle at 50% 60%,rgba(128,97,255,.18),rgba(9,13,20,.96) 68%)}.results .skin-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.results .price{font-size:18px}.results .card-btn{display:none}.results .fav{right:17px;top:16px;width:30px;height:30px}.results .condition{font-size:11px}.results .trend{font-size:11px}.catalog-footerline{display:flex;justify-content:space-between;gap:15px;color:#657186;font-size:11px;padding:16px 0 28px}.steam-mini{display:flex;align-items:center;gap:8px}.admin-link{white-space:nowrap}@media(max-width:1200px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.market-layout{grid-template-columns:1fr}.market-sidebar{position:static}.results{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-toolbar{grid-template-columns:1fr}}@media(max-width:600px){.results{grid-template-columns:1fr}.market-tabs{padding-inline:2px}.catalog-shell{padding:0 10px}}
</style></head><body>
<header class="topbar"><div class="shell"><a class="logo" href="index.html">Skin<span>Forge</span></a><nav><a href="catalog.html">Каталог</a><a href="analytics.html">Аналитика</a><a href="arbitrage.html">Арбитраж</a><a href="calculator.html">Калькулятор</a><a href="portfolio.html">Портфель</a><a href="favorites.html">Избранное</a><a href="support.html">Поддержка</a><span id="adminNav"></span></nav><div class="actions"><div id="authMini"><a class="primary" href="/auth/steam">Войти через Steam</a></div></div></div></header>
<div class="catalog-shell">
<div class="market-tabs" id="marketTabs"><button class="market-tab active" data-cat="">◫ Все</button><button class="market-tab" data-cat="Ножи">🔪 Ножи</button><button class="market-tab" data-q="Gloves">🧤 Перчатки</button><button class="market-tab" data-cat="Пистолеты">▱ Пистолеты</button><button class="market-tab" data-cat="ПП">⌁ ПП</button><button class="market-tab" data-cat="Винтовки">⌖ Винтовки</button><button class="market-tab" data-cat="AWP">🎯 AWP</button><button class="market-tab" data-cat="Снайперские">◉ Снайперские</button><button class="market-tab" data-q="M4A4">M4A4</button><button class="market-tab" data-q="AK-47">AK-47</button><button class="market-tab" data-q="USP-S">USP-S</button></div>
<div class="catalog-toolbar"><div class="searchbox">⌕ <input id="topSearch" placeholder="Поиск по скинам, оружию, названию..."></div><select id="topSort"><option value="">По популярности</option><option value="low">Сначала дешёвые</option><option value="high">Сначала дорогие</option><option value="rise">Сильнее растут</option><option value="fall">Сильнее падают</option></select></div>
<div class="market-layout"><aside class="market-sidebar"><div class="side-title"><h3>Фильтры</h3><button class="reset-btn" id="resetFilters">Сбросить</button></div><div class="filter-group"><label>Поиск</label><input id="searchInput" placeholder="Название скина"></div><div class="filter-group"><label>Цена (USD)</label><div class="price-pair"><input id="minPrice" type="number" placeholder="От 0"><input id="maxPrice" type="number" placeholder="До 10000"></div></div><div class="sidebar-divider"></div><div class="filter-group"><label>Категория</label><select id="category"><option value="">Все категории</option><option value="Винтовки">Винтовки</option><option value="AWP">AWP</option><option value="Снайперские">Снайперские</option><option value="Пистолеты">Пистолеты</option><option value="ПП">ПП</option><option value="Ножи">Ножи</option></select></div><div class="filter-group"><label>Оружие</label><select id="weaponFilter"><option value="">Все оружие</option><option>AK-47</option><option>AUG</option><option>AWP</option><option>Butterfly Knife</option><option>Desert Eagle</option><option>Glock-18</option><option>Karambit</option><option>M4A1-S</option><option>M4A4</option><option>M9 Bayonet</option><option>MP9</option><option>P250</option><option>SSG 08</option><option>USP-S</option></select></div><div class="filter-group"><label>Износ</label><select id="conditionFilter"><option value="">Любой износ</option><option value="Factory New">Factory New (FN)</option><option value="Minimal Wear">Minimal Wear (MW)</option><option value="Field-Tested">Field-Tested (FT)</option><option value="Well-Worn">Well-Worn (WW)</option><option value="Battle-Scarred">Battle-Scarred (BS)</option></select></div><div class="filter-group"><label>StatTrak™</label><select id="stattrakFilter"><option value="all">Обычные + StatTrak</option><option value="yes">Только StatTrak</option><option value="no">Без StatTrak</option></select></div><div class="filter-group" style="display:none"><select id="sort"><option value=""></option><option value="low">low</option><option value="high">high</option><option value="rise">rise</option><option value="fall">fall</option></select></div><label class="check-row"><input id="onlyFav" type="checkbox"> ❤ Только избранное</label><label class="check-row"><input type="checkbox" id="liveOnly" checked> ● Только реальные Skinport</label></aside>
<section class="catalog-main"><div class="catalog-head"><h2>Каталог скинов</h2><span class="catalog-meta" id="resultCount"></span></div><div class="results" id="catalogGrid"></div><div id="pager" class="pager"></div></section></div><div class="catalog-footerline"><span>SkinForge Market v16.4 • реальные цены Skinport</span><span>Каталог: оружие, ножи и перчатки</span></div></div>
<script src="data.js?v=164"></script><script src="app.js?v=164"></script><script src="catalog-fix.js?v=164"></script><script>
const fire=(el,type='input')=>el&&el.dispatchEvent(new Event(type,{bubbles:true}));
addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search);if(q.get('cat')){category.value=q.get('cat');fire(category)}if(q.get('fav')){onlyFav.checked=true;fire(onlyFav,'change')}topSearch.addEventListener('input',()=>{searchInput.value=topSearch.value;fire(searchInput)});topSort.addEventListener('change',()=>{sort.value=topSort.value;fire(sort)});marketTabs.addEventListener('click',e=>{const b=e.target.closest('.market-tab');if(!b)return;document.querySelectorAll('.market-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');category.value=b.dataset.cat||'';searchInput.value=b.dataset.q||'';topSearch.value=b.dataset.q||'';fire(category);fire(searchInput)});resetFilters.addEventListener('click',()=>{[searchInput,minPrice,maxPrice].forEach(x=>x.value='');category.value='';weaponFilter.value='';conditionFilter.value='';stattrakFilter.value='all';onlyFav.checked=false;liveOnly.checked=true;topSearch.value='';topSort.value='';sort.value='';[searchInput,minPrice,maxPrice,category,weaponFilter,conditionFilter,stattrakFilter,sort].forEach(fire);fire(onlyFav,'change')})});
(async()=>{try{const d=await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json());if(!d.authenticated)return;const p=d.profile||{};authMini.innerHTML='<a class="ghost" href="profile.html">'+(p.personaname||'Steam')+'</a>';if(d.is_admin)adminNav.innerHTML='<a class="admin-link" href="admin.html">Админка</a>'}catch(e){}})();
</script></body></html>
