<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рынок — AEROX</title><link rel="stylesheet" href="styles.css?v=201"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#19b9ff"><style>
:root{--brand:#19b9ff;--brand2:#75d8ff;--line:#17334b;--panel:#0a1520;--panel2:#0d1b29;--muted:#7f9bb1;--text:#f4fbff}
body{background:radial-gradient(circle at 18% -10%,rgba(25,185,255,.16),transparent 32%),radial-gradient(circle at 90% 0%,rgba(40,112,255,.10),transparent 30%),#06101a;color:var(--text)}
.topbar{background:rgba(5,14,23,.92);border-bottom:1px solid #123149}.topbar .shell{max-width:1500px}.logo{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:4px;color:#fff}.logo-mark{width:34px;height:28px;position:relative;display:inline-block}.logo-mark:before,.logo-mark:after{content:"";position:absolute;top:3px;width:24px;height:8px;background:linear-gradient(90deg,#13bfff,#78dcff);clip-path:polygon(0 0,100% 45%,65% 100%,15% 55%)}.logo-mark:before{left:0;transform:rotate(22deg)}.logo-mark:after{right:0;transform:scaleX(-1) rotate(22deg)}.logo-x{color:#1fc5ff}.topbar nav a{color:#9eb5c6}.topbar nav a:hover,.topbar nav a.active{color:#fff}.pro-nav{color:#37caff!important}.primary{background:linear-gradient(90deg,#18bfff,#1594ff);box-shadow:0 0 25px rgba(25,185,255,.20)}
.market-hero{max-width:1500px;margin:0 auto;padding:34px 18px 8px}.market-hero .eyebrow{color:#35c9ff}.market-hero h1{font-size:42px;margin:5px 0 8px}.market-hero h1 span{color:#28c8ff}.market-hero p{color:#8ea8ba;margin:0;max-width:720px}
.catalog-shell{max-width:1500px;margin:auto;padding:0 18px}.market-tabs{display:flex;gap:8px;overflow:auto;padding:18px 0 12px;border-bottom:1px solid #163249;scrollbar-width:none}.market-tabs::-webkit-scrollbar{display:none}.market-tab{white-space:nowrap;border:1px solid #17364f;background:#091723;color:#a9c1d2;border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}.market-tab.active,.market-tab:hover{border-color:#1bbcff;background:#0b2233;color:#fff;box-shadow:0 0 18px rgba(25,185,255,.10)}
.catalog-toolbar{display:grid;grid-template-columns:1fr 210px;gap:12px;margin:14px 0}.searchbox{display:flex;align-items:center;gap:10px;background:#081722;border:1px solid #183b55;border-radius:12px;padding:0 14px}.searchbox input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:13px 0}.catalog-toolbar select{background:#081722;border:1px solid #183b55;color:#fff;border-radius:12px;padding:0 12px}
.market-layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.market-sidebar{position:sticky;top:84px;height:max-content;background:linear-gradient(180deg,#091824,#07131e);border:1px solid #17364f;border-radius:14px;padding:15px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.side-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.side-title h3{margin:0}.reset-btn{border:0;background:transparent;color:#35c9ff;cursor:pointer}.filter-group{margin:0 0 16px}.filter-group label{display:block;color:#9ab3c5;font-size:12px;margin-bottom:7px}.filter-group input,.filter-group select{width:100%;background:#06111a;border:1px solid #1b3a50;color:white;border-radius:9px;padding:10px}.price-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-row{display:flex;align-items:center;gap:9px;color:#b5c9d7;font-size:13px;margin:10px 0}.check-row input{width:auto}.sidebar-divider{height:1px;background:#153248;margin:14px 0}.catalog-main{min-width:0}.catalog-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}.catalog-head h2{margin:0;font-size:22px}.catalog-meta{color:#7f9bb1;font-size:12px}
.results{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.results .card{border-radius:14px;padding:11px;background:linear-gradient(160deg,#0b1b29,#07131e);border:1px solid #17364f;min-width:0;box-shadow:0 15px 35px rgba(0,0,0,.18)}.results .card:hover{border-color:#1dbfff;transform:translateY(-3px)}.results .skin-art{height:150px;border-radius:11px;background:radial-gradient(circle at 50% 60%,rgba(25,185,255,.16),rgba(5,15,24,.97) 68%);border-color:#15364d}.results .skin-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.results .price{font-size:18px}.results .card-btn{display:none}.results .fav{right:17px;top:16px;width:30px;height:30px;background:#081723;border-color:#1b4059}.results .condition{font-size:11px}.results .trend{font-size:11px}.pager button{background:#0a1a27;border-color:#1b4059}.pager button:hover{border-color:#1ebfff}.catalog-footerline{display:flex;justify-content:space-between;gap:15px;color:#58758a;font-size:11px;padding:16px 0 28px}.admin-link{white-space:nowrap}
@media(max-width:1200px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.market-layout{grid-template-columns:1fr}.market-sidebar{position:static}.results{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-toolbar{grid-template-columns:1fr}.market-hero h1{font-size:34px}}@media(max-width:600px){.results{grid-template-columns:1fr}.market-tabs{padding-inline:2px}.catalog-shell{padding:0 10px}.market-hero{padding-inline:12px}.topbar nav{display:none}}
</style></head><body>
<header class="topbar"><div class="shell"><a class="logo" href="index.html"><span class="logo-mark"></span>AERO<span class="logo-x">X</span></a><nav><a class="active" href="catalog.html">Рынки</a><a href="radar.html">Сканер</a><a href="analytics.html">Аналитика</a><a href="portfolio.html">Портфель</a><a href="arbitrage.html">Арбитраж</a><a href="calculator.html">Инструменты</a><a class="pro-nav" href="pro.html">♛ Pro</a><span id="adminNav"></span></nav><div class="actions"><div id="authMini"><a class="primary" href="/auth/steam">Войти</a></div></div></div></header>
<section class="market-hero"><div class="eyebrow">AEROX MARKET</div><h1>Рынок скинов <span>CS2</span></h1><p>Ищи нужные скины, фильтруй рынок и сравнивай реальные цены в едином интерфейсе AEROX.</p></section>
<div class="catalog-shell">
<div class="market-tabs" id="marketTabs"><button class="market-tab active" data-cat="">◫ Все</button><button class="market-tab" data-cat="Ножи">🔪 Ножи</button><button class="market-tab" data-q="Gloves">🧤 Перчатки</button><button class="market-tab" data-cat="Пистолеты">▱ Пистолеты</button><button class="market-tab" data-cat="ПП">⌁ ПП</button><button class="market-tab" data-cat="Винтовки">⌖ Винтовки</button><button class="market-tab" data-cat="AWP">🎯 AWP</button><button class="market-tab" data-cat="Снайперские">◉ Снайперские</button><button class="market-tab" data-q="M4A4">M4A4</button><button class="market-tab" data-q="AK-47">AK-47</button><button class="market-tab" data-q="USP-S">USP-S</button></div>
<div class="catalog-toolbar"><div class="searchbox">⌕ <input id="topSearch" placeholder="Поиск по скинам, оружию, названию..."></div><select id="topSort"><option value="">По популярности</option><option value="low">Сначала дешёвые</option><option value="high">Сначала дорогие</option><option value="rise">Сильнее растут</option><option value="fall">Сильнее падают</option></select></div>
<div class="market-layout"><aside class="market-sidebar"><div class="side-title"><h3>Фильтры</h3><button class="reset-btn" id="resetFilters">Сбросить</button></div><div class="filter-group"><label>Поиск</label><input id="searchInput" placeholder="Название скина"></div><div class="filter-group"><label>Цена (USD)</label><div class="price-pair"><input id="minPrice" type="number" placeholder="От 0"><input id="maxPrice" type="number" placeholder="До 10000"></div></div><div class="sidebar-divider"></div><div class="filter-group"><label>Категория</label><select id="category"><option value="">Все категории</option><option value="Винтовки">Винтовки</option><option value="AWP">AWP</option><option value="Снайперские">Снайперские</option><option value="Пистолеты">Пистолеты</option><option value="ПП">ПП</option><option value="Ножи">Ножи</option></select></div><div class="filter-group"><label>Оружие</label><select id="weaponFilter"><option value="">Все оружие</option><option>AK-47</option><option>AUG</option><option>AWP</option><option>Butterfly Knife</option><option>Desert Eagle</option><option>Glock-18</option><option>Karambit</option><option>M4A1-S</option><option>M4A4</option><option>M9 Bayonet</option><option>MP9</option><option>P250</option><option>SSG 08</option><option>USP-S</option></select></div><div class="filter-group"><label>Износ</label><select id="conditionFilter"><option value="">Любой износ</option><option value="Factory New">Factory New (FN)</option><option value="Minimal Wear">Minimal Wear (MW)</option><option value="Field-Tested">Field-Tested (FT)</option><option value="Well-Worn">Well-Worn (WW)</option><option value="Battle-Scarred">Battle-Scarred (BS)</option></select></div><div class="filter-group"><label>StatTrak™</label><select id="stattrakFilter"><option value="all">Обычные + StatTrak</option><option value="yes">Только StatTrak</option><option value="no">Без StatTrak</option></select></div><div class="filter-group" style="display:none"><select id="sort"><option value=""></option><option value="low">low</option><option value="high">high</option><option value="rise">rise</option><option value="fall">fall</option></select></div><label class="check-row"><input id="onlyFav" type="checkbox"> ❤ Только избранное</label><label class="check-row"><input type="checkbox" id="liveOnly" checked> ● Только реальные Skinport</label></aside>
<section class="catalog-main"><div class="catalog-head"><h2>Скины на рынке</h2><span class="catalog-meta" id="resultCount"></span></div><div class="results" id="catalogGrid"></div><div id="pager" class="pager"></div></section></div><div class="catalog-footerline"><span>AEROX Market • реальные цены Skinport</span><span>Оружие, ножи и перчатки</span></div></div>
<script src="data.js?v=201"></script><script src="app.js?v=201"></script><script src="catalog-fix.js?v=201"></script><script>
const fire=(el,type='input')=>el&&el.dispatchEvent(new Event(type,{bubbles:true}));
addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search);if(q.get('cat')){category.value=q.get('cat');fire(category)}if(q.get('fav')){onlyFav.checked=true;fire(onlyFav,'change')}topSearch.addEventListener('input',()=>{searchInput.value=topSearch.value;fire(searchInput)});topSort.addEventListener('change',()=>{sort.value=topSort.value;fire(sort)});marketTabs.addEventListener('click',e=>{const b=e.target.closest('.market-tab');if(!b)return;document.querySelectorAll('.market-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');category.value=b.dataset.cat||'';searchInput.value=b.dataset.q||'';topSearch.value=b.dataset.q||'';fire(category);fire(searchInput)});resetFilters.addEventListener('click',()=>{[searchInput,minPrice,maxPrice].forEach(x=>x.value='');category.value='';weaponFilter.value='';conditionFilter.value='';stattrakFilter.value='all';onlyFav.checked=false;liveOnly.checked=true;topSearch.value='';topSort.value='';sort.value='';[searchInput,minPrice,maxPrice,category,weaponFilter,conditionFilter,stattrakFilter,sort].forEach(fire);fire(onlyFav,'change')})});
(async()=>{try{const d=await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json());if(!d.authenticated)return;const p=d.profile||{};authMini.innerHTML='<a class="ghost" href="profile.html">'+(p.personaname||'Steam')+'</a>';if(d.is_admin)adminNav.innerHTML='<a class="admin-link" href="admin.html">Админка</a>'}catch(e){}})();
</script></body></html>
