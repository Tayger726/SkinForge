<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка поддержки — SkinForge</title><link rel="stylesheet" href="styles.css?v=163"><style>.admin-wrap{max-width:1180px;margin:32px auto;padding:0 20px}.admin-grid{display:grid;gap:14px}.ticket-admin{background:#101722;border:1px solid #26324a;border-radius:16px;padding:16px}.ticket-admin header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{font-size:12px;color:#8b96a8}.msg{white-space:pre-wrap;margin:12px 0;background:#0b1018;border-radius:12px;padding:12px}.reply{width:100%;min-height:110px;background:#0b1018;color:#fff;border:1px solid #2c3956;border-radius:10px;padding:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.row select,.row input{background:#0b1018;color:#fff;border:1px solid #2c3956;border-radius:10px;padding:10px}.badge{padding:5px 9px;border-radius:999px;background:#1b2434}.claim{max-width:520px}.hidden{display:none}</style></head><body><header class="topbar"><div class="shell"><a class="logo" href="index.html">Skin<span>Forge</span></a><nav><a href="catalog.html">Каталог</a><a href="support.html">Поддержка</a></nav><div class="actions"><a class="primary" href="/auth/logout">Выйти</a></div></div></header><main class="admin-wrap"><h1>Админка поддержки</h1><p class="muted">Все обращения пользователей SkinForge.</p><section id="claimBox" class="panel claim hidden"><h3>Назначить администратора</h3><p class="muted">Введи одноразовый код администратора. Это можно сделать только один раз.</p><div class="row"><input id="claimToken" placeholder="Код администратора"><button class="primary" id="claimBtn">Активировать</button></div><div id="claimMsg" class="muted" style="margin-top:10px"></div></section><section id="panel" class="hidden"><div class="panel" style="margin:18px 0"><div class="row"><select id="status"><option value="all">Все статусы</option><option value="open">Открытые</option><option value="answered">Отвеченные</option><option value="closed">Закрытые</option></select><input id="search" placeholder="Поиск по теме / SteamID"><button class="primary" id="refresh">Обновить</button></div></div><div id="tickets" class="admin-grid"></div></section><section id="gate" class="panel"><h3>Проверка доступа…</h3></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const gate=document.getElementById('gate'),panel=document.getElementById('panel'),claim=document.getElementById('claimBox');async function check(){const me=await fetch('/api/me').then(r=>r.json()).catch(()=>({}));if(!me.authenticated){gate.innerHTML='<h3>Нужен вход через Steam</h3><a class="primary" href="/auth/steam">Войти через Steam</a>';return}const r=await fetch('/api/admin/me');if(r.ok){gate.classList.add('hidden');panel.classList.remove('hidden');load();return}if(r.status===403){gate.classList.add('hidden');claim.classList.remove('hidden');return}gate.innerHTML='<h3>Ошибка проверки доступа</h3>'}async function load(){const st=document.getElementById('status').value,q=document.getElementById('search').value.trim();const u='/api/admin/tickets?status='+encodeURIComponent(st)+'&q='+encodeURIComponent(q);const d=await fetch(u).then(r=>r.json());const root=document.getElementById('tickets');if(!d.ok){root.innerHTML='<div class="panel">'+esc(d.error||'Ошибка')+'</div>';return}root.innerHTML=(d.tickets||[]).map(t=>`<article class="ticket-admin"><header><div><strong>#${t.id} — ${esc(t.subject)}</strong><div class="meta">SteamID: ${esc(t.steamid)} • ${new Date(t.created_at).toLocaleString('ru-RU')} • ${esc(t.category||'other')}</div></div><span class="badge">${esc(t.status)}</span></header><div class="msg">${esc(t.message)}</div><textarea class="reply" id="reply-${t.id}" placeholder="Ответ пользователю">${esc(t.reply||'')}</textarea><div class="row" style="margin-top:10px"><select id="status-${t.id}"><option value="open" ${t.status==='open'?'selected':''}>Открыто</option><option value="answered" ${t.status==='answered'?'selected':''}>Отвечено</option><option value="closed" ${t.status==='closed'?'selected':''}>Закрыто</option></select><button class="primary" onclick="saveTicket(${t.id})">Сохранить ответ</button></div></article>`).join('')||'<div class="panel">Обращений пока нет.</div>'}async function saveTicket(id){const reply=document.getElementById('reply-'+id).value,status=document.getElementById('status-'+id).value;const r=await fetch('/api/admin/tickets/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply,status})});const d=await r.json();if(!r.ok)return alert(d.error||'Ошибка');load()}document.getElementById('refresh').onclick=load;document.getElementById('status').onchange=load;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')load()};document.getElementById('claimBtn').onclick=async()=>{const token=document.getElementById('claimToken').value.trim();const r=await fetch('/api/admin/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();document.getElementById('claimMsg').textContent=d.ok?'Администратор активирован. Обновляю…':(d.error||'Ошибка');if(d.ok)setTimeout(()=>location.reload(),700)};check();</script></body></html>
