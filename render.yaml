services:
  - type: web
    name: skinforge-market
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
